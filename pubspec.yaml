name: krushikranti_farmer
description: "Farmer App for Krushi Kranti"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 
  
  # Networking
  http: ^1.2.0
  
  # Storage & UI
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Enable Auto-Generation for Localization
  generate: true

  # Asset Configuration
  assets:
    -  assets/images/logo/
    -  assets/images/auth/